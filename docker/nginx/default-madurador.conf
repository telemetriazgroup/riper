# App servida bajo /madurador/ (misma ruta en IP:18080 y detrás de Apache en ztrack.app/madurador/)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /madurador/;
    }

    location = /madurador {
        return 301 /madurador/;
    }

    location /madurador/ripener-api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /madurador/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /madurador/ {
        try_files $uri $uri/ /madurador/index.html;
    }
}
